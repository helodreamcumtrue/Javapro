# ==========================================================
# Goal Decomposition Engine - application configuration
# ==========================================================

# Server (accepts cloud-assigned PORT or defaults to 8080)
server.port=${PORT:8080}

# ---- SQLite datasource ----
# The .db file is created automatically. On cloud platforms, set DB_PATH or SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:${DB_PATH:goal_decomposition.db}}
spring.datasource.driver-class-name=org.sqlite.JDBC

# ---- Hibernate / JPA ----
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# create-drop would wipe data every restart; "update" keeps data between runs.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQLite is file-based and does not handle concurrent writers well.
# Keeping the pool to a single connection avoids "database is locked" errors.
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=1

# JSON: don't fail on empty/optional fields
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
